apis:
  - aid: federal-trade-commission:developer-portal
    name: FTC Developer Portal
    description: >-
      The FTC Developer Portal is the central hub for developer documentation, data
      dictionaries, and access program details for FTC-managed datasets and services. It
      names the API base URL (https://api.ftc.gov/v0), the api.data.gov key requirement,
      and the two published endpoints.
    humanURL: https://www.ftc.gov/developer
    baseURL: https://api.ftc.gov
    tags:
      - Federal-Government
      - Documentation
    tags_raw:
      - Federal Government
      - Documentation
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/federal-trade-commission.png
    properties:
      - type: Documentation
        url: https://www.ftc.gov/developer
      - type: Website
        url: https://www.ftc.gov/
      - type: SourceCode
        url: https://github.com/FederalTradeCommission/ftc-api-docs
  - aid: federal-trade-commission:dnc-complaints
    name: Do Not Call (DNC) Reported Calls Data API
    description: >-
      Read-only REST endpoint returning consumer reports of unwanted and illegal
      telemarketing calls, filterable by complaint date, violation date, consumer state
      and city, originating area code and robocall flag. Responses are JSON:API-shaped,
      capped at 50 records per page, and the corpus is refreshed each weekday by about
      noon Eastern. Requires a free api.data.gov key; DEMO_KEY works without signup.
    humanURL: https://www.ftc.gov/developer/api/v0/endpoints/do-not-call-dnc-reported-calls-data-api
    baseURL: https://api.ftc.gov/v0
    tags:
      - Do Not Call
      - Consumer Protection
      - Federal-Government
      - Open Data
    tags_raw:
      - Do Not Call
      - Consumer Protection
      - Federal Government
      - Open Data
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/federal-trade-commission.png
    properties:
      - type: APIReference
        url: https://www.ftc.gov/developer/api/v0/endpoints/do-not-call-dnc-reported-calls-data-api
      - type: Documentation
        url: https://github.com/FederalTradeCommission/ftc-api-docs/blob/master/docs/endpoint-dnc-complaints.md
  - aid: federal-trade-commission:hsr-early-termination-notices
    name: HSR Early Termination Notices API
    description: >-
      Read-only REST endpoint returning Hart-Scott-Rodino premerger notifications for
      which early termination of the waiting period was granted, filterable by title
      keyword, transaction number and transaction date. Responses declare JSON:API 1.0.
      The early termination programme was suspended in February 2021; the endpoint serves
      the historical record. Requires a free api.data.gov key.
    humanURL: https://www.ftc.gov/developer/api/v0/endpoints/hsr-early-termination-notices
    baseURL: https://api.ftc.gov/v0
    tags:
      - Antitrust
      - Mergers
      - Federal-Government
      - Open Data
    tags_raw:
      - Antitrust
      - Mergers
      - Federal Government
      - Open Data
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/federal-trade-commission.png
    properties:
      - type: APIReference
        url: https://www.ftc.gov/developer/api/v0/endpoints/hsr-early-termination-notices
      - type: Documentation
        url: https://github.com/FederalTradeCommission/ftc-api-docs/blob/master/docs/endpoint-hsr-early-termination-notices.md
      - type: About
        url: https://www.ftc.gov/enforcement/competition-matters/2018/06/ftc-launches-first-web-api-make-early-terminations-more-accessible
  - aid: federal-trade-commission:do-not-call-registry
    name: National Do Not Call Registry
    description: >-
      The National Do Not Call Registry program lets telemarketers and sellers download
      phone-number data they must scrub against before placing calls. Access is
      provisioned through telemarketing.donotcall.gov, requires registration and a
      statutory annual per-area-code fee, and is governed by the Telemarketing Sales Rule.
      No public machine-readable contract is published for it.
    humanURL: https://telemarketing.donotcall.gov
    tags:
      - Do Not Call
      - Consumer Protection
      - Telemarketing
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/federal-trade-commission.png
    properties:
      - type: Documentation
        url: https://telemarketing.donotcall.gov
      - type: Consumer Site
        url: https://www.donotcall.gov
  - aid: federal-trade-commission:consumer-sentinel
    name: Consumer Sentinel Network
    description: >-
      Consumer Sentinel is the FTC's secure online database of consumer reports of fraud,
      identity theft, and other complaints, made available to participating federal,
      state, local, and international law enforcement agencies through a vetted access
      program. Membership is required; no public API contract is published.
    humanURL: https://www.ftc.gov/enforcement/consumer-sentinel-network
    tags:
      - Consumer Protection
      - Law Enforcement
      - Fraud
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/federal-trade-commission.png
    properties:
      - type: Documentation
        url: https://www.ftc.gov/enforcement/consumer-sentinel-network
      - type: Data Book
        url: https://www.ftc.gov/enforcement/consumer-sentinel-network/reports
  - aid: federal-trade-commission:hsr-premerger
    name: HSR Premerger Notification
    description: >-
      The Hart-Scott-Rodino (HSR) Premerger Notification Program coordinates premerger
      filings reviewed by the FTC and DOJ. Filings are submitted electronically through
      the dedicated HSR e-filing system.
    humanURL: https://www.ftc.gov/enforcement/premerger-notification-program
    tags:
      - Antitrust
      - Mergers
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/federal-trade-commission.png
    properties:
      - type: Documentation
        url: https://www.ftc.gov/enforcement/premerger-notification-program
      - type: E-Filing
        url: https://www.hsr.gov
