aid: federal-trade-commission
name: Federal Trade Commission
description: >-
  The Federal Trade Commission (FTC) is a U.S. federal agency that enforces antitrust
  and consumer protection laws affecting virtually every area of commerce. The FTC
  operates a small public, read-only REST API at https://api.ftc.gov/v0 — fronted by
  the api.data.gov gateway and covering Do Not Call consumer complaint reports and
  Hart-Scott-Rodino premerger early termination notices — alongside a Project Open Data
  (DCAT-US 1.1) inventory of 95 datasets at https://www.ftc.gov/data.json. Two further
  developer-facing programmes are gated rather than public: the National Do Not Call
  Registry telemarketer download at telemarketing.donotcall.gov, and the Consumer
  Sentinel Network of consumer complaint data shared with vetted law enforcement.
