description: >-
  There is no separate FTC sandbox environment — no test host, no test/live key split, no
  fixtures, no time simulation. What exists is a real, published, no-signup credential:
  the api.data.gov DEMO_KEY, which the FTC uses verbatim in its own documented examples
  and which returns live production data at a reduced rate limit. That is the whole
  try-before-you-register surface, and it works.
