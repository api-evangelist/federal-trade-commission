description: >-
  The FTC publishes no plans and no pricing for its public API. https://api.ftc.gov/v0 is
  free to anyone holding an api.data.gov key, which is self-issued at no cost, and the
  data it returns is U.S. Government public domain
  (http://www.usa.gov/publicdomain/label/1.0/, declared per dataset in
  https://www.ftc.gov/data.json). There is no paid tier, no overage, no quota purchase and
  no commercial agreement of any kind. This file replaces a 2026-05-04 scaffold that
  invented Free / Professional / Enterprise tiers with placeholder quotas and "TBD" prices
  — the FTC has never published them.
