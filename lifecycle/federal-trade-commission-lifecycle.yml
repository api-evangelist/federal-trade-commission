data_freshness:
  dnc_complaints: updated each weekday by approximately noon Eastern; weekends on Monday
  hsr_early_termination: historical record; programme suspended February 2021
gaps_for_provider:
  - Publish a dated changelog for api.ftc.gov and link it from /developer.
  - Graduate v0 to v1 with a stated compatibility policy, or say plainly that v0 is stable.
  - Publish a status page, or name the api.data.gov status surface consumers should watch.
  - Emit Sunset/Deprecation headers (RFC 8594) on any endpoint scheduled for retirement.
